aid: la-vie
name: La Vie
description: >-
  La Vie Foods is a Paris-based plant-based food company that makes vegan alternatives to pork
  products, including bacon, smoked lardons, ham, salami sticks, croquettes and meatballs, sold
  across French and UK retail and foodservice. Its stated mission is to move people from animal to
  vegetable fat without compromising on taste, citing 88% less CO2, 82% less water and 74% less land
  use than conventional pork. Its products are stocked by retailers including Tesco, Sainsbury's,
  Waitrose, Whole Foods Market and Planet Organic, and used by restaurant partners such as Burger
  King. The company was surfaced as a portfolio company of partech. La Vie Foods operates as a
  consumer packaged-goods brand rather than an API provider: it publishes no public developer
  portal, OpenAPI, SDKs, CLI, packages or programmatic API surface, and exposes no /.well-known/
  discovery documents. This profile therefore captures the company's real public web, legal, press
  and domain-security surface rather than developer artifacts.
